services:
  db:
    build: { context: ., target: db }
    image: ${DOCKERHUB_USER}/sentinet-matomo-db:${TAG:-1.0}
    restart: unless-stopped
    volumes:
      - db:/var/lib/mysql:Z
    environment:
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}

  app:
    build: { context: ., target: app }
    image: ${DOCKERHUB_USER}/sentinet-matomo:${TAG:-1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - matomo:/var/www/html:z
    environment:
      - MATOMO_DATABASE_PASSWORD=${DB_PASSWORD}
    ports:
      - "${MATOMO_PORT:-8081}:80"

  wp-db:
    build: { context: ., target: wp-db }
    image: ${DOCKERHUB_USER}/sentinet-wp-db:${TAG:-1.0}
    restart: unless-stopped
    volumes:
      - wp-db:/var/lib/mysql
    environment:
      - MARIADB_PASSWORD=${WP_DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${WP_DB_ROOT_PASSWORD}

  wordpress:
    build: { context: ., target: wordpress }
    image: ${DOCKERHUB_USER}/sentinet-wordpress:${TAG:-1.0}
    restart: unless-stopped
    depends_on:
      wp-db:
        condition: service_healthy
    volumes:
      - wp-data:/var/www/html
    environment:
      - WORDPRESS_DB_PASSWORD=${WP_DB_PASSWORD}
    ports:
      - "${WP_PORT:-8082}:80"

  web:
    build: { context: ., target: web }
    image: ${DOCKERHUB_USER}/sentinet-web:${TAG:-1.0}
    container_name: netsentinel-site
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

volumes:
  db:
  matomo:
  wp-db:
  wp-data: