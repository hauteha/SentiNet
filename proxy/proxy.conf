server_tokens off;

# DNS interne de Docker : résout les noms à chaque requête, pas au démarrage
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Toute requête avec un nom de domaine inconnu est rejetée
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name netsentinel.localhost;
    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
    }
}

server {
    listen 80;
    server_name matomo.localhost;
    location / {
        set $upstream http://app:80;
        proxy_pass $upstream;
    }
}

server {
    listen 80;
    server_name wp.localhost;
    client_max_body_size 64M;
    location / {
        set $upstream http://wordpress:80;
        proxy_pass $upstream;
    }
}
