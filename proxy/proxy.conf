server_tokens off;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Toute requête avec un nom de domaine inconnu est rejetée
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name netsentinel.localhost;
    location / { proxy_pass http://web:80; }
}

server {
    listen 80;
    server_name matomo.localhost;
    location / { proxy_pass http://app:80; }
}

server {
    listen 80;
    server_name wp.localhost;
    client_max_body_size 64M;          # sinon les uploads > 1 Mo sont refusés
    location / { proxy_pass http://wordpress:80; }
}